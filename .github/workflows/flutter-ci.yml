name: Flutter CI & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.22.0
  JAVA_VERSION: 17

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;30.0.2 platform-tools'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Cache Flutter pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .pub-cache
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-pub-

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate android/local.properties
        run: |
          echo "android/local.properties is generated in CI and must never be committed"
          echo "flutter.dir=$(dirname $(dirname $(which flutter)))" > android/local.properties
          echo "flutter.sdk=$(dirname $(dirname $(which flutter)))" >> android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Build release APK
        run: |
          CLEAN_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${CLEAN_VERSION#v}"
          flutter build apk --release --build-name="$CLEAN_VERSION" --build-number="${{ github.run_number }}"

      - name: Rename APK with version
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/fps-monitor-${{ github.event.inputs.version }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: fps-monitor-${{ github.event.inputs.version }}
          path: build/app/outputs/flutter-apk/fps-monitor-${{ github.event.inputs.version }}.apk
          if-no-files-found: error

      - name: Create Git Tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: build/app/outputs/flutter-apk/fps-monitor-${{ github.event.inputs.version }}.apk
          generate_release_notes: true

